name: school2036-dev
services:
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: school2036
      POSTGRES_USER: school
      POSTGRES_PASSWORD: school
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school -d school2036"]
      interval: 2s
      timeout: 2s
      retries: 20
  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
  scanner:
    image: clamav/clamav:1.5.4@sha256:ebec5bc138401b36ae987caa1a3fa3c3b2a21ed3d51f0bfa5852825e663e67b0
    profiles: ["full", "media"]
    ports: ["127.0.0.1:3310:3310"]
    mem_limit: 4g
    volumes: ["scanner_data:/var/lib/clamav"]
  mail:
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    profiles: ["full"]
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]

volumes:
  postgres_data:
  redis_data:
  scanner_data:
