[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["unit: deterministic source-navigation checks"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"rag_service/api.py" = ["B008"]
